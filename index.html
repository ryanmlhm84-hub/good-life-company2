<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرارك يحدد طريقك</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 100%);
    color: white;
    font-family: Arial, Tahoma, sans-serif;
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100%;
}

.screen {
    width: 100%;
    height: 100%;
    position: relative;
    background: transparent;
}

/* =========================
   شاشة البداية
========================= */

#startScreen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    background: radial-gradient(circle at center, #1f1f3a 0%, #0d0d0d 100%);
}

#startScreen h1 {
    margin: 0 0 20px;
    font-size: clamp(36px, 6vw, 70px);
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 5px 15px rgba(255, 65, 108, 0.3);
}

#startScreen p {
    margin: 0 0 24px;
    font-size: clamp(18px, 2.5vw, 28px);
    color: #d1d5db;
}

#playerName {
    width: min(420px, 90%);
    padding: 14px 18px;
    margin: 0 0 24px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
    background: rgba(15, 15, 25, 0.88);
    color: white;
    font-size: 20px;
    text-align: center;
    outline: none;
}

#playerName:focus {
    border-color: #ff416c;
    box-shadow: 0 0 0 3px rgba(255, 65, 108, 0.2);
}

.startButton,
.restartButton {
    border: 0;
    padding: 16px 45px;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
    color: white;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 65, 108, 0.4);
    transition: all 0.3s ease;
}

.startButton:hover,
.restartButton:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 30px rgba(255, 65, 108, 0.6);
}

/* =========================
   شاشة الفيديو
========================= */

#gameScreen {
    display: none;
    width: 100%;
    height: 100%;
    position: relative;
    background: black;
}

#gameVideo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: black;
}

/* =========================
   زر كتم الصوت
========================= */

#muteButton {
    display: none;
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(20, 20, 30, 0.8);
    backdrop-filter: blur(8px);
    color: white;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.2s;
}

#muteButton:hover {
    background: rgba(40, 40, 60, 0.9);
}

/* =========================
   السؤال
========================= */

#question {
    display: none;
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(850px, 90%);
    padding: 18px 24px;
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border-radius: 14px;
    text-align: center;
    font-size: clamp(18px, 2.5vw, 28px);
    z-index: 10;
    color: #f3f4f6;
}

/* =========================
   الاختيارات
========================= */

#choices {
    display: none;
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: min(850px, 90%);
    flex-direction: column;
    gap: 12px;
    z-index: 10;
}

.choiceButton {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 14px;
    background: rgba(15, 15, 25, 0.88);
    backdrop-filter: blur(12px);
    color: white;
    font-size: clamp(17px, 2vw, 23px);
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    transition: all 0.25s ease;
}

.choiceButton:hover {
    background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
    border-color: #ff416c;
    color: white;
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 25px rgba(255, 65, 108, 0.4);
}

/* =========================
   شاشة النهاية
========================= */

#endScreen {
    display: none;
    width: 100%;
    height: 100%;
    padding: 30px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: radial-gradient(circle at center, #1f1f3a 0%, #0d0d0d 100%);
}

#endTitle {
    margin: 0 0 20px;
    font-size: clamp(35px, 5vw, 60px);
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

#endText {
    max-width: 800px;
    margin: 0;
    line-height: 1.8;
    color: #d1d5db;
    font-size: clamp(18px, 2.5vw, 26px);
}

.restartButton {
    margin-top: 35px;
}

/* =========================
   رسالة الخطأ
========================= */

/* شعار اللعبة - يبقى ظاهرًا طوال اللعبة */
#gameLogo {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 180px;
    height: auto;
    z-index: 100;
    pointer-events: none;
    user-select: none;
}

@media (max-width: 700px) {
    #gameLogo {
        width: 125px;
        top: 10px;
        right: 10px;
    }
}

#errorMessage {
    display: none;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(800px, 90%);
    padding: 12px;
    background: rgba(220, 38, 38, 0.9);
    backdrop-filter: blur(8px);
    color: white;
    border-radius: 10px;
    text-align: center;
    z-index: 50;
    font-weight: bold;
}
</style>
</head>

        <section id="startScreen">
            <h1>قرارك يحدد طريقك</h1>
            <p>كل قرار تتخذه يمكن أن يغير مجرى القصة</p>
            <label for="playerName" style="font-size:20px; margin-bottom:12px;">شو اسمك؟</label>
            <input id="playerName" type="text" maxlength="30" placeholder="اكتب اسمك هنا" autocomplete="given-name">
            <button class="startButton" id="startButton" type="button">ابدأ اللعبة</button>
        </section>

        <!-- شاشة اللعبة -->
        <section id="gameScreen">
            <video id="gameVideo" playsinline preload="auto"></video>
            <button id="muteButton" type="button">🔊 كتم الصوت</button>

            <div id="choices"></div>
            <div id="errorMessage"></div>
        </section>

            <p id="endText">لقد وصلت إلى نهاية رحلتك</p>

<script>
const scenes = {
    1: {
        index: "scene1.mp4",
        question: "ماذا سيفعل {playerName} عندما يبدأ المشروع؟",
        choices: [
            { text: "يبدأ العمل مباشرة", next: 2 },
            { text: "يؤجل العمل", next: 6 }
        ]
    },

    2: {
        index: "scene2.mp4",
        question: "كيف سيتعامل {playerName} مع المهمة؟",
        choices: [
            { text: "يبدأ العمل بتركيز", next: 4 },
            { text: "يترك المهمة لوقت آخر", next: 8 }
        ]
    },

    3: {
        index: "scene3.mp4",
        question: "بعد تأجيل العمل ماذا سيفعل {playerName}؟",
        choices: [
            { text: "يبدأ العمل رغم ضيق الوقت", next: 4 },
            { text: "يطلب المساعدة من زملائه", next: 9 }
        ]
    },

    4: {
        index: "scene4.mp4",
        question: "كيف سيتعامل {playerName} مع صعوبة العمل؟",
        choices: [
            { text: "يتعاون مع فريق العمل", next: 5 },
            { text: "يحاول العمل بمفرده", next: 6 }
        ]
    },

    5: {
        index: "scene5.mp4",
        question: "بعد التعاون مع الفريق ماذا سيفعل {playerName}؟",
        choices: [
            { text: "يحاول حل المشكلة بنفسه", next: 7 },
            { text: "يتجاهل الأخطاء ويكمل", next: 6 }
        ]
    },

    6: {
        index: "scene6.mp4",
        question: "واجه {playerName} بسبب تأجيل العمل ماذا سيفعل؟",
        choices: [
            { text: "يطلب المساعدة من زملائه", next: 5 },
            { text: "يحاول حل المشكلة بنفسه", next: 7 }
        ]
    },

    7: {
        index: "scene7.mp4",
        question: "ظهر خطأ أثناء العمل ماذا سيفعل {playerName}؟",
        choices: [
            { text: "يراجع الخطأ ويحاول تصحيحه", next: 3 },
            { text: "يتجاهل الخطأ ويكمل", next: 11 }
        ]
    },

    8: {
        index: "scene8.mp4",
        question: "بعد الانتهاء من العمل ماذا سيفعل {playerName}؟",
        choices: [
            { text: "يتدارك المشروع قبل تسليمه", next: 9 },
            { text: "يسلم المشروع مباشرة", next: 11 }
        ]
    },

    9: {
        index: "scene9.mp4",
        question: "بعد أن طلب {playerName} المساعدة، ماذا سيفعل؟",
        choices: [
            { text: "تسلم", next: 10 },
            { text: "يتوقف عن العمل في اللحظة الأخيرة", next: 11 }
        ]
    },

    10: {
        index: "scene10.mp4",
        question: "أصبح المشروع جاهزاً ماذا سيفعل {playerName}؟",
        choices: [
            { text: "تسلم", next: 11 },
            { text: "تسلم", next: 11 }
        ]
    },

    11: {
        index: "scene11.mp4",
        end: true,
        title: "النهاية",
        text: "تعلم {playerName} أن القرارات التي يتخذها أثناء العمل تؤثر على النتيجة وأن التفكير والمراجعة وطلب المساعدة يمكن أن تساعده على الوصول إلى نتيجة أفضل"
    }
};

let currentScene = 1;
let isMuted = false;
let playerName = "ريان";

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");
const gameVideo = document.getElementById("gameVideo");
const question = document.getElementById("question");
const choices = document.getElementById("choices");
const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");
const muteButton = document.getElementById("muteButton");
const errorMessage = document.getElementById("errorMessage");
const playerNameInput = document.getElementById("playerName");

startButton.addEventListener("click", function() {
    const enteredName = playerNameInput.value.trim();
    if (!enteredName) {
        playerNameInput.focus();
        playerNameInput.setCustomValidity("اكتب اسمك أولاً");
        playerNameInput.reportValidity();
        return;
    }
    playerNameInput.setCustomValidity("");
    playerName = enteredName;
    startScreen.style.display = "none";
    endScreen.style.display = "none";
    gameScreen.style.display = "block";
    muteButton.style.display = "block";
    currentScene = 1;
    loadScene(currentScene);
});

function loadScene(sceneNumber) {
    const scene = scenes[sceneNumber];
    if (!scene) {
        showError("حدث خطأ: المشهد رقم " + sceneNumber + " غير موجود");
        return;
    }
    currentScene = sceneNumber;
    choices.style.display = "none";
    choices.innerHTML = "";
    question.style.display = "none";
    hideError();

    gameVideo.pause();
    gameVideo.currentTime = 0;
    gameVideo.src = scene.video;
    gameVideo.load();
    applyMuteState(isMuted);

    const playPromise = gameVideo.play();
    if (playPromise !== undefined) {
        playPromise.catch(function() {
            // بعض المتصفحات تمنع التشغيل بالصوت؛ ابدأ الفيديو صامتًا وحدّث حالة الزر أيضًا.
            isMuted = true;
            applyMuteState(true);
            gameVideo.play().catch(function() {});
        });
    }
}

gameVideo.addEventListener("ended", function() {
    const scene = scenes[currentScene];
    if (!scene) return;
    showChoices(scene);
});

function showChoices(scene) {
    choices.innerHTML = "";
    if (scene.end === true) {
        showEnding(scene);
        return;
    }
    question.textContent = scene.question.replaceAll("{playerName}", playerName);
    question.style.display = "block";

    if (!scene.choices || scene.choices.length === 0) return;

    scene.choices.forEach(function(choice) {
        const button = document.createElement("button");
        button.className = "choiceButton";
        button.type = "button";
        button.textContent = choice.text;
        button.addEventListener("click", function() {
                    loadScene(choice.next);
        });
        choices.appendChild(button);
    });
    choices.style.display = "flex";
}

function showEnding(scene) {
    gameVideo.pause();
    gameScreen.style.display = "none";
    endScreen.style.display = "flex";
    document.getElementById("endTitle").textContent = scene.title || "نهاية القصة";
    document.getElementById("endText").textContent = (scene.text || "لقد وصلت إلى نهاية القصة").replaceAll("{playerName}", playerName);
}

restartButton.addEventListener("click", function() {
    endScreen.style.display = "none";
    gameScreen.style.display = "block";
    currentScene = 1;
    loadScene(currentScene);
});

function applyMuteState(muted) {
    isMuted = muted;
    gameVideo.muted = muted;
    gameVideo.defaultMuted = muted;
    gameVideo.volume = muted ? 0 : 1;
    muteButton.textContent = muted ? "🔇 تشغيل الصوت" : "🔊 كتم الصوت";
    muteButton.setAttribute("aria-label", muted ? "تشغيل الصوت" : "كتم الصوت");
}

muteButton.addEventListener("click", function() {
    // لا نشغّل صوت النقرة هنا حتى لا يبدو أن زر الكتم لا يعمل.
    applyMuteState(!isMuted);
});

gameVideo.addEventListener("error", function() {
    showError("تعذر تحميل الفيديو. تأكد من أن اسم الفيديو صحيح وأنه موجود داخل مجلد videos");
});

function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = "block";
}

function hideError() {
    errorMessage.textContent = "";
    errorMessage.style.display = "none";
}
</script>

</body>
</html>
